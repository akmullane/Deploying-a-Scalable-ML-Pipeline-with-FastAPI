name: Gain Mullane

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest flake8

      - name: Lint (flake8)
        run: |
          flake8 .

      - name: Test (pytest)
        run: |
          pytest -q
